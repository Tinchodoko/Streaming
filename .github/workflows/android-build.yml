name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/Streaming-debug-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Streaming-debug
          path: release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: "Streaming Debug Build #${{ github.run_number }}"
          body: |
            Automated debug APK build from the `main` branch.

            Commit: `${{ github.sha }}`

            This is a test build, not a production-signed release.
          files: release/*.apk
          draft: false
          prerelease: true
